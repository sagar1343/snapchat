<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://kit.fontawesome.com/06fd46cb4b.js" crossorigin="anonymous"></script>
    <style>
        * {
            font-family: "Public Sans", sans-serif;
        }
    </style>
</head>

<body>
    <div class="h-screen bg-gray-900 flex justify-center items-center">
        <div class="h-full relative sm:h-[90vh] bg-white w-full sm:max-w-96 sm:rounded-lg">
            {% block main %}
            {% endblock %}
            <nav class="dock absolute bg-neutral text-neutral-content">
                <button>
                    <i class="fa-solid fa-location-dot"></i>
                    <span class="dock-label">Map</span>
                </button>

                <button class="dock-active">
                    <i class="fa-solid fa-message"></i>
                    <span class="dock-label">Chat</span>
                </button>

                <button>
                    <i class="fa-solid fa-camera"></i>
                    <span class="dock-label">Camera</span>
                </button>
                <button>
                    <i class="fa-solid fa-user-group"></i>
                    <span class="dock-label">Stories</span>
                </button>
            </nav>
        </div>
    </div>
</body>

</html>
